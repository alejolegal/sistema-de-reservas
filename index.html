<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservá tu cancha | Un Show Más</title>
    <meta name="description" content="Reservá online canchas de Fútbol 5, Fútbol 7 y Pádel. Elegí el día y el horario disponible y asegurá tu turno.">
    <meta name="theme-color" content="#03045E">
    <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header id="site-header"></header>

    <main id="contenido" class="container">
        <section class="hero" aria-labelledby="hero-titulo">
            <p class="eyebrow">Reservas online</p>
            <h1 id="hero-titulo">Reservá tu cancha en <span>Un Show Más</span></h1>
            <p class="hero-sub">Fútbol 5, Fútbol 7 y Pádel. Elegí el día, tocá un horario libre y asegurá tu turno en un minuto.</p>
            <ol class="pasos">
                <li><span>1</span> Elegí el día y el horario</li>
                <li><span>2</span> Pagá la seña</li>
                <li><span>3</span> ¡A jugar!</li>
            </ol>
        </section>
        <span id="hero-nombre" hidden></span>

        <div id="aviso-promo"></div>
        <section id="panel-usuario" class="user-panel" aria-label="Mi cuenta" hidden></section>

        <section class="reglas-card" aria-labelledby="reglas-titulo">
            <h2 id="reglas-titulo">Antes de reservar</h2>
            <ul id="lista-reglas"></ul>
        </section>

        <section aria-labelledby="catalogo-titulo">
            <h2 id="catalogo-titulo" class="section-title">Elegí tu cancha</h2>
            <div class="canchas-grid" id="catalogo-canchas"></div>
        </section>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="js/store.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
