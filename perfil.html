<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mis reservas | Un Show Más</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#03045E">
    <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header id="site-header" class="site-header"></header>

    <main id="contenido" class="container perfil-container">
        <div id="seccion-cuenta" hidden>
            <section class="puntos-banner" aria-label="Resumen">
                <div>
                    <p class="eyebrow">Mi cuenta</p>
                    <h1>Hola, <span id="perfil-saludo-nombre"></span></h1>
                    <p>Turnos reservados: <strong id="perfil-total-alquileres">0</strong></p>
                </div>
                <div class="puntos-num"><span id="perfil-puntos-val">0</span> <small>puntos</small></div>
            </section>
        </div>

        <section id="seccion-invitado" class="card-box invitado" hidden>
            <h1 class="perfil-sec-title">Mis reservas</h1>
            <p class="muted">Acá ves las reservas que hiciste <strong>desde este celular</strong>. Si creás una cuenta, sumás puntos y las ves desde cualquier lado.</p>
            <div class="acciones-fila">
                <a class="btn btn-secundario" href="login.html?next=perfil.html">Ingresar</a>
                <a class="btn btn-secundario" href="login.html?tab=registro&next=perfil.html">Crear cuenta</a>
            </div>
        </section>

        <section class="card-box" aria-labelledby="titulo-reservas">
            <h2 id="titulo-reservas" class="perfil-sec-title">Turnos</h2>
            <div id="lista-mis-reservas"><div class="skeleton"></div><div class="skeleton"></div></div>
        </section>

        <div id="seccion-datos" hidden>
            <details class="card-box plegable" id="bloque-datos">
                <summary class="perfil-sec-title">Mis datos</summary>
                <form id="form-perfil" onsubmit="return false" novalidate>
                    <div class="form-grid">
                        <div class="field">
                            <label for="input-nombre">Nombre y apellido</label>
                            <input type="text" id="input-nombre" required autocomplete="name">
                        </div>
                        <div class="field">
                            <label for="input-telefono">WhatsApp</label>
                            <input type="tel" id="input-telefono" required autocomplete="tel" inputmode="numeric">
                        </div>
                    </div>
                    <p id="perfil-error" class="error-msg" role="alert" hidden></p>
                    <button type="submit" class="btn">Guardar datos</button>
                </form>
            </details>
            <details class="card-box plegable">
                <summary class="perfil-sec-title">Cambiar contraseña</summary>
                <form id="form-password" onsubmit="return false" novalidate>
                    <div class="form-grid">
                        <div class="field">
                            <label for="input-password-actual">Contraseña actual</label>
                            <input type="password" id="input-password-actual" autocomplete="current-password" required>
                        </div>
                        <div class="field">
                            <label for="input-password">Nueva contraseña</label>
                            <input type="password" id="input-password" autocomplete="new-password" minlength="6" required>
                        </div>
                    </div>
                    <p id="password-error" class="error-msg" role="alert" hidden></p>
                    <button type="submit" class="btn">Cambiar contraseña</button>
                </form>
            </details>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="vendor/supabase-2.119.0.js"></script>
    <script src="js/env.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/db.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/perfil.js"></script>
</body>

</html>
