<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | Un Show Más</title>
    <meta name="theme-color" content="#03045E">
    <meta name="robots" content="noindex">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header id="site-header" class="site-header"></header>

    <main id="contenido" class="container">
        <div class="auth-container">
            <h1 class="auth-titulo">Tu cuenta</h1>
            <p class="muted centrado">Con tu cuenta sumás puntos y ves todas tus reservas. <a href="index.html">También podés reservar sin cuenta.</a></p>
            <div class="auth-tabs" role="tablist" aria-label="Acceso">
                <button type="button" role="tab" class="auth-tab active" id="tab-login" aria-controls="form-login" aria-selected="true">Iniciar sesión</button>
                <button type="button" role="tab" class="auth-tab" id="tab-registro" aria-controls="form-registro" aria-selected="false">Registrarme</button>
            </div>

            <form id="form-login" onsubmit="return false" role="tabpanel" aria-labelledby="tab-login" novalidate>
                <div class="field">
                    <label for="login-email">Correo electrónico</label>
                    <input type="email" id="login-email" required autocomplete="email" placeholder="ejemplo@correo.com">
                </div>
                <div class="field">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required autocomplete="current-password">
                </div>
                <p id="login-error" class="error-msg" role="alert" hidden></p>
                <button type="submit" class="btn btn-block" disabled>Ingresar</button>
                <button type="button" class="btn-link centrado-bloque" id="olvide">¿Olvidaste tu contraseña?</button>
            </form>

            <form id="form-registro" onsubmit="return false" role="tabpanel" aria-labelledby="tab-registro" novalidate hidden>
                <div class="field">
                    <label for="reg-nombre">Nombre y apellido</label>
                    <input type="text" id="reg-nombre" required autocomplete="name" placeholder="Juan Pérez">
                </div>
                <div class="field">
                    <label for="reg-email">Correo electrónico</label>
                    <input type="email" id="reg-email" required autocomplete="email" placeholder="ejemplo@correo.com">
                </div>
                <div class="field">
                    <label for="reg-telefono">WhatsApp</label>
                    <input type="tel" id="reg-telefono" required autocomplete="tel" inputmode="numeric" placeholder="Ej: 3415551234">
                    <p class="hint">Con característica y sin 0 ni 15. Lo usamos solo para avisarte por tu reserva.</p>
                </div>
                <div class="field">
                    <label for="reg-password">Contraseña (mínimo 6 caracteres)</label>
                    <input type="password" id="reg-password" required autocomplete="new-password" minlength="6">
                </div>
                <div class="field">
                    <label for="reg-password2">Repetí la contraseña</label>
                    <input type="password" id="reg-password2" required autocomplete="new-password">
                </div>
                <p id="reg-error" class="error-msg" role="alert" hidden></p>
                <button type="submit" class="btn btn-block" disabled>Crear cuenta</button>
            </form>
        </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>

    <script src="vendor/supabase-2.119.0.js"></script>
    <script src="js/env.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/db.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
